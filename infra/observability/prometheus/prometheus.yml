# Scrapes every SkyBook service's /actuator/prometheus. Targets use host.docker.internal so the same
# config works whether a service runs from the IDE on the host or as a container of the "apps" profile
# (both publish the service port on the host).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: skybook
    metrics_path: /actuator/prometheus
    # Services tag their own metrics with application=<name>; keep that instead of exported_application.
    honor_labels: true
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { application: api-gateway }
      - targets: ["host.docker.internal:8081"]
        labels: { application: inventory-service }
      - targets: ["host.docker.internal:8082"]
        labels: { application: booking-service }
      - targets: ["host.docker.internal:8083"]
        labels: { application: payment-service }
      - targets: ["host.docker.internal:8084"]
        labels: { application: notification-service }
      - targets: ["host.docker.internal:8085"]
        labels: { application: event-bridge }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
