<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Booking changed</title></head>
<body style="margin:0;background:#f4f6fa;">
<div th:replace="~{email/fragments :: header}"></div>
<main style="font-family:Arial,sans-serif;color:#1a1a1a;padding:24px;">
  <h1 style="font-size:22px;">Your booking has been changed</h1>
  <p>You moved from flight <span th:text="${previousFlightNumber}">SB101</span> to flight
     <strong th:text="${flightNumber}">SB101</strong>, departing
     <strong th:text="${departureTime}">2026-12-12T08:00:00Z</strong> (UTC).</p>
  <h2 style="font-size:18px;">New e-ticket numbers</h2>
  <ul>
    <li th:each="ticket : ${ticketNumbers}" th:text="${ticket}">1763333333333</li>
  </ul>
</main>
<div th:replace="~{email/fragments :: footer}"></div>
</body>
</html>
