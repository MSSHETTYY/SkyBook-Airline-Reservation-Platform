server:
  port: 8082
  shutdown: graceful

spring:
  cloud:
    vault:
      # Off by default; the "vault" profile switches it on (application-vault.yml).
      enabled: false
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${BOOKING_DB_URL:jdbc:mariadb://localhost:3306/booking}
    username: ${BOOKING_DB_USER:booking_app}
    password: ${BOOKING_DB_PASSWORD:booking_dev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Commit only after the listener (and its database transaction) succeeded.
        enable.auto.commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/skybook}
      client:
        registration:
          # booking-service's own identity for calls to inventory/payment (client credentials grant).
          skybook-services:
            provider: keycloak
            client-id: booking-service
            client-secret: ${BOOKING_CLIENT_SECRET:booking-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # Explicit token URI (no OIDC discovery) so start-up does not depend on Keycloak being up.
            token-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/skybook}/protocol/openid-connect/token

management:
  metrics:
    distribution:
      # Histograms for the SLO latency objective (p95 < 300 ms) and burn-rate alerts (ADR-0019).
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 100ms,300ms,1s
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

skybook:
  crypto:
    # Personal data encryption key ring. In every real environment the keys come from Vault
    # (profile "vault"); this development key only exists so the service starts locally.
    active-key: ${CRYPTO_ACTIVE_KEY:dev1}
    keys:
      dev1: ${CRYPTO_KEY_DEV1:ZGV2LW9ubHkta2V5LWZvci1sb2NhbC1za3lib29rISE=}
  booking:
    expiry-interval: PT30S
    saga-recovery-interval: PT30S
    clients:
      payment:
        base-url: ${PAYMENT_BASE_URL:http://localhost:8083}
        read-timeout: 5s
        oauth2-registration-id: skybook-services
      gds:
        base-url: ${GDS_BASE_URL:http://localhost:8095}
        read-timeout: 4s
      crm:
        base-url: ${CRM_BASE_URL:http://localhost:8095}
        read-timeout: 1s
      loyalty:
        base-url: ${LOYALTY_BASE_URL:http://localhost:8095}
        read-timeout: 1s
    inventory:
      base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
      connect-timeout: 2s
      read-timeout: 3s
      oauth2-registration-id: skybook-services

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.skybook.booking.adapter.out.inventory.InventoryUnavailableException
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.skybook.booking.adapter.out.support.RemoteCall$Unavailable
  retry:
    instances:
      inventory:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.skybook.booking.adapter.out.inventory.InventoryUnavailableException
      payment:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.skybook.booking.adapter.out.support.RemoteCall$Unavailable
      gds:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.skybook.booking.adapter.out.support.RemoteCall$Unavailable
      crm:
        # Customer-facing path with a safe fallback: one quick retry, then STANDARD tier.
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - com.skybook.booking.adapter.out.support.RemoteCall$Unavailable
      loyalty:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - com.skybook.booking.adapter.out.support.RemoteCall$Unavailable
  bulkhead:
    instances:
      # Caps concurrent calls per partner so one slow partner cannot exhaust request/consumer threads.
      payment:
        max-concurrent-calls: 25
        max-wait-duration: 200ms
      gds:
        max-concurrent-calls: 10
        max-wait-duration: 200ms
      crm:
        max-concurrent-calls: 20
        max-wait-duration: 0ms
      loyalty:
        max-concurrent-calls: 5
        max-wait-duration: 0ms

