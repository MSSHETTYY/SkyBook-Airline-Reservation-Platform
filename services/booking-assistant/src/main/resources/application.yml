server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: booking-assistant
  threads:
    virtual:
      enabled: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # Small enough for an 8 GB laptop (~2 GB RAM) and supports tool calling.
          model: ${OLLAMA_MODEL:llama3.2:3b}
          temperature: 0.2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/skybook}

management:
  metrics:
    distribution:
      # Histograms for the SLO latency objective and burn-rate alerts (ADR-0019).
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 100ms,300ms,1s
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

skybook:
  assistant:
    inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
    booking-base-url: ${BOOKING_BASE_URL:http://localhost:8082}
    read-timeout: 3s
    memory-messages: 12
