server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: payment-service
  cloud:
    vault:
      # Off by default; the "vault" profile switches it on (application-vault.yml).
      enabled: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mariadb://localhost:3306/payment}
    username: ${PAYMENT_DB_USER:payment_app}
    password: ${PAYMENT_DB_PASSWORD:payment_dev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/skybook}

management:
  metrics:
    distribution:
      # Histograms for the SLO latency objective (p95 < 300 ms) and burn-rate alerts (ADR-0019).
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]": 100ms,300ms,1s
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true

skybook:
  crypto:
    active-key: ${CRYPTO_ACTIVE_KEY:dev1}
    keys:
      dev1: ${CRYPTO_KEY_DEV1:ZGV2LW9ubHkta2V5LWZvci1sb2NhbC1za3lib29rISE=}
  payment:
    # "fake" needs no Stripe account; set "stripe" plus test-mode keys to use Stripe (see README).
    provider: ${PAYMENT_PROVIDER:fake}
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_local_development_only}
    webhook-tolerance: 5m

resilience4j:
  bulkhead:
    instances:
      payment-provider:
        max-concurrent-calls: 20
        max-wait-duration: 100ms
  circuitbreaker:
    instances:
      payment-provider:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        record-exceptions:
          - com.skybook.payment.provider.ProviderUnavailableException
  retry:
    instances:
      payment-provider:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.skybook.payment.provider.ProviderUnavailableException
