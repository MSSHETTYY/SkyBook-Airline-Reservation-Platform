# SkyBook local infrastructure.
#
# Sized for a 7.8 GB laptop running Docker Desktop/WSL2 capped at ~4 GB (see docs/dev/wslconfig.example
# and docs/adr/0003-local-runtime-footprint.md). Run ONE or TWO profiles at a time, e.g.:
#
#   docker compose --profile core up -d                 # Oracle + MariaDB + Redis       (~2.6 GB)
#   docker compose --profile messaging up -d            # Kafka + Solace                 (~2.5 GB)
#   docker compose --profile auth --profile partners up -d
#   docker compose --profile secrets up -d             # Vault (dev mode) seeded with service secrets
#
# Credentials below are development-only defaults; override them in .env (see .env.example).
# Production secrets come from Vault (Phase 2), never from this file.

name: skybook

x-defaults: &defaults
  restart: unless-stopped
  networks: [skybook]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

# Shared by the application containers (profile "apps").
x-app: &app
  <<: *defaults
  profiles: [apps]
  mem_limit: 512m
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
  # Issuer stays the browser-facing URL (see keycloak), keys are fetched over the container network.
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/skybook
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/skybook/protocol/openid-connect/certs
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -Xss512k
  # Observability (profile "observability", ADR-0019): traces to Jaeger over OTLP, ECS JSON logs for Loki.
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

services:

  # ---------------------------------------------------------------- core ----
  oracle:
    <<: *defaults
    image: gvenzl/oracle-free:23-slim-faststart
    profiles: [core]
    mem_limit: 2g
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-oracle_admin_dev}
      # Creates the schema owner for inventory-service inside the FREEPDB1 pluggable database.
      APP_USER: inventory
      APP_USER_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_dev}
    ports: ["1521:1521"]
    volumes: [oracle-data:/opt/oracle/oradata]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  mariadb:
    <<: *defaults
    image: mariadb:11.8.9
    profiles: [core]
    mem_limit: 384m
    # One server, one schema + one user per service (see ADR-0003): isolation without a second JVM-sized footprint.
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-mariadb_root_dev}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_dev}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment_dev}
    ports: ["3306:3306"]
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    <<: *defaults
    image: redis:8.10.3-alpine
    profiles: [core]
    mem_limit: 128m
    # Pure cache / read model / rate-limit counters: no persistence, LRU eviction under memory pressure.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_dev}
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------- messaging ----
  kafka:
    <<: *defaults
    image: apache/kafka:4.1.2
    profiles: [messaging]
    mem_limit: 1g
    environment:
      # Single-node KRaft (combined broker + controller). No ZooKeeper.
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 9mvtcA6CRL25CXPz6cyQdg # base64url UUID, as produced by kafka-storage.sh random-uuid
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers on this network, EXTERNAL for services started from the IDE on the host,
      # DOCKERHOST for other Docker networks such as the kind cluster (deploy/kind).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,DOCKERHOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,DOCKERHOST://host.docker.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKERHOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topics (incl. DLTs) are declared explicitly by the owning service - typos must fail, not create topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["9092:9092", "9094:9094"]
    # No volume on purpose: dev topics are recreated by the services; avoids root-owned volume
    # permission issues with the non-root apache/kafka image.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  solace:
    <<: *defaults
    image: solace/solace-pubsub-standard:10.26.9
    profiles: [messaging]
    mem_limit: 1536m
    shm_size: 1g
    ulimits:
      core: -1
      nofile:
        soft: 2448
        hard: 6592
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: ${SOLACE_ADMIN_PASSWORD:-solace_admin_dev}
      # Smallest supported scaling tier keeps the broker around 1 GB.
      system_scaling_maxconnectioncount: "100"
    ports:
      - "8190:8080"   # PubSub+ Manager / SEMP
      - "55555:55555" # SMF - used by the Solace JMS API
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5550/health-check/guaranteed-active"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # ---------------------------------------------------------------- auth ----
  keycloak:
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [auth]
    mem_limit: 768m
    # Imports infra/keycloak/skybook-realm.json (roles, SPA PKCE client, service account, demo users).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_dev}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # Tokens always carry iss=http://localhost:8180/realms/skybook, also when containers fetch them via
      # http://keycloak:8080 (back channel), so browser and service tokens validate the same way.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=65
    ports: ["8180:8080"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships without curl; use bash's /dev/tcp against the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ------------------------------------------------------------- secrets ----
  # HashiCorp Vault in dev mode (in-memory, unsealed, root token) plus a one-shot job that seeds secrets.
  vault:
    <<: *defaults
    image: hashicorp/vault:2.2.1
    profiles: [secrets]
    mem_limit: 256m
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-skybook-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-init:
    image: hashicorp/vault:2.2.1
    profiles: [secrets]
    networks: [skybook]
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-secrets.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_TOKEN:-skybook-dev-root}
    volumes: [./infra/vault:/init:ro]

  # -------------------------------------------------------- notification ----
  mongodb:
    <<: *defaults
    # 7.0, not 8.x: MongoDB 8 refuses to start on Linux kernels >= 6.19 (SERVER-121912, see docs/runbook.md).
    image: mongo:7.0.45
    profiles: [notification]
    mem_limit: 512m
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_root_dev}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    <<: *defaults
    image: axllent/mailpit:v1.33.0
    profiles: [notification]
    mem_limit: 64m
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------ partners ----
  wiremock:
    <<: *defaults
    image: wiremock/wiremock:3.13.2-alpine
    profiles: [partners]
    mem_limit: 256m
    command: ["--global-response-templating", "--disable-banner"]
    environment:
      JAVA_OPTS: -Xmx160m
    ports: ["8095:8080"]
    volumes: [./mock-partners/wiremock:/home/wiremock:ro]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------------- observability
  # Profile "observability" (~0.9 GB): Grafana http://localhost:3000 (dashboards: SkyBook folder),
  # Jaeger http://localhost:16686, Prometheus http://localhost:9090.
  jaeger:
    <<: *defaults
    image: jaegertracing/jaeger:2.11.0
    profiles: [observability]
    mem_limit: 256m
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/helm/skybook/files/skybook-slo-rules.yml:/etc/prometheus/rules/skybook-slo-rules.yml:ro
    ports: ["9090:9090"]

  loki:
    <<: *defaults
    image: grafana/loki:3.5.7
    profiles: [observability]
    mem_limit: 256m
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
    ports: ["3100:3100"]

  alloy:
    <<: *defaults
    image: grafana/alloy:v1.11.3
    profiles: [observability]
    mem_limit: 128m
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    <<: *defaults
    image: grafana/grafana:12.2.1
    profiles: [observability]
    mem_limit: 192m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/skybook-overview.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  # ---------------------------------------------------------------------------------- applications
  # Profile "apps": the services as containers (needs the infrastructure profiles running). On an 8 GB
  # machine start only what you need, e.g. `docker compose --profile apps up -d inventory-service`.
  inventory-service:
    <<: *app
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: inventory-service } }
    image: ghcr.io/msshettyy/skybook-inventory-service:${SKYBOOK_TAG:-dev}
    environment:
      <<: *app-env
      INVENTORY_DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
    ports: ["8081:8081"]

  booking-service:
    <<: *app
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: booking-service } }
    image: ghcr.io/msshettyy/skybook-booking-service:${SKYBOOK_TAG:-dev}
    environment:
      <<: *app-env
      BOOKING_DB_URL: jdbc:mariadb://mariadb:3306/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_BASE_URL: http://inventory-service:8081
      PAYMENT_BASE_URL: http://payment-service:8083
      GDS_BASE_URL: http://wiremock:8080
      CRM_BASE_URL: http://wiremock:8080
      LOYALTY_BASE_URL: http://wiremock:8080
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/skybook/protocol/openid-connect/token
    ports: ["8082:8082"]

  payment-service:
    <<: *app
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: payment-service } }
    image: ghcr.io/msshettyy/skybook-payment-service:${SKYBOOK_TAG:-dev}
    environment:
      <<: *app-env
      PAYMENT_DB_URL: jdbc:mariadb://mariadb:3306/payment
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports: ["8083:8083"]

  notification-service:
    <<: *app
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: notification-service } }
    image: ghcr.io/msshettyy/skybook-notification-service:${SKYBOOK_TAG:-dev}
    environment:
      <<: *app-env
      MONGODB_URI: mongodb://root:${MONGO_ROOT_PASSWORD:-mongo_root_dev}@mongodb:27017/notifications?authSource=admin
      SOLACE_HOST: tcp://solace:55555
      SMTP_HOST: mailpit
    ports: ["8084:8084"]

  event-bridge:
    <<: *app
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: event-bridge } }
    image: ghcr.io/msshettyy/skybook-event-bridge:${SKYBOOK_TAG:-dev}
    environment:
      <<: *app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SOLACE_HOST: tcp://solace:55555
    ports: ["8085:8085"]

  api-gateway:
    <<: *app
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: api-gateway } }
    image: ghcr.io/msshettyy/skybook-api-gateway:${SKYBOOK_TAG:-dev}
    environment:
      <<: *app-env
      INVENTORY_URI: http://inventory-service:8081
      BOOKING_URI: http://booking-service:8082
      PAYMENT_URI: http://payment-service:8083
      ASSISTANT_URI: http://booking-assistant:8086
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8088
    ports: ["8080:8080"]

  web-ui:
    <<: *defaults
    profiles: [apps]
    build: { context: ., dockerfile: web-ui/Dockerfile }
    image: ghcr.io/msshettyy/skybook-web-ui:${SKYBOOK_TAG:-dev}
    mem_limit: 64m
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    environment:
      SKYBOOK_GATEWAY_URL: http://api-gateway:8080
      SKYBOOK_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    ports: ["8088:8080"]

  # ------------------------------------------------------------------------------------------- AI
  # Profile "ai" (Phase 8, ADR-0021): local LLM + booking assistant. Needs ~3 GB with llama3.2:3b, so
  # stop other profiles first on an 8 GB machine. Pull the model once:
  #   docker compose --profile ai exec ollama ollama pull llama3.2:3b
  ollama:
    <<: *defaults
    image: ollama/ollama:0.12.10
    profiles: [ai]
    mem_limit: 3g
    volumes:
      - ollama-models:/root/.ollama
    ports: ["11434:11434"]

  booking-assistant:
    <<: *app
    profiles: [ai]
    build: { context: ., dockerfile: services/Dockerfile, args: { SERVICE: booking-assistant } }
    image: ghcr.io/msshettyy/skybook-booking-assistant:${SKYBOOK_TAG:-dev}
    environment:
      <<: *app-env
      OLLAMA_BASE_URL: http://ollama:11434
      INVENTORY_BASE_URL: http://inventory-service:8081
      BOOKING_BASE_URL: http://booking-service:8082
    ports: ["8086:8086"]

networks:
  skybook:
    name: skybook

volumes:
  oracle-data:
  mariadb-data:
  mongo-data:
  keycloak-data:
  ollama-models:
