{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skybook
  labels:
    {{- include "skybook.labels" (list . "skybook") | nindent 4 }}
  annotations:
    {{- with .Values.ingress.tls.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # One origin for the SPA and its API: no CORS, and the CSP stays simple.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port: { name: http }
{{- end }}
