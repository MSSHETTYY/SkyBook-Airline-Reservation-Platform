{{- if .Values.secrets.create }}
# Local clusters only (values-kind.yaml). Real environments use Vault or an externally managed Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "skybook.labels" (list . "skybook") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
