{{- $root := . -}}
{{- range $name := include "skybook.enabledServices" . | fromJsonArray }}
---
# One identity per service: the Vault Kubernetes-auth role of the same name grants only its own secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "skybook.labels" (list $root $name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
